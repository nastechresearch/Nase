# Single source of truth for the capability surface.
#
# Names verified against (do not edit without re-checking all four):
#   wire    shared/src/protocol.ts  CommandOp
#   mcp     packages/mcp/src/server.ts  registerTool
#   kotlin  android/.../brain/AdapterRequests.kt  ToolSpec
#   cli     client/src/cli.ts  .command / case
#
# Surfaces genuinely disagree on some names; the mapping is the point of this
# file, not an accident:
#   press (wire) == key (mcp, kotlin)     ask_user (wire, mcp) == ask (kotlin)
# A surface key present means "this surface exposes the op"; absent means it does
# not. `params` documents the payload; the generator emits names and summaries
# only, and leaves the typed payload in shared/src/protocol.ts.
#
# `npm run describe` regenerates shared/src/generated/ops.ts and the Kotlin
# manifest; `npm run describe -- --check` fails on drift.

version: 1

ops:
  # --- screen read ---
  - id: screenshot
    summary: Capture the screen as a JPEG and return its size.
    wire: screenshot
    mcp: screenshot
    cli: [screenshot]

  - id: ui_tree
    summary: Read the accessibility tree of the current screen.
    wire: ui_tree
    mcp: ui_tree
    cli: [ui_tree, tree]

  - id: wait_idle
    summary: Wait for the screen to stop changing instead of guessing.
    wire: wait_idle
    mcp: wait_idle
    cli: [wait_idle, wait]
    params:
      - { name: timeoutMs, type: number, required: false }

  # --- gestures ---
  - id: tap
    summary: Tap at screen coordinates, preferring a labelled target.
    wire: tap
    mcp: tap
    kotlin: tap
    cli: [tap]
    params:
      - { name: x, type: number, required: true }
      - { name: y, type: number, required: true }
      - { name: label, type: string, required: false }

  - id: swipe
    summary: Swipe between two points, optionally with a duration.
    wire: swipe
    mcp: swipe
    kotlin: swipe
    cli: [swipe]
    params:
      - { name: x1, type: number, required: true }
      - { name: y1, type: number, required: true }
      - { name: x2, type: number, required: true }
      - { name: y2, type: number, required: true }
      - { name: durationMs, type: number, required: false }

  - id: long_press
    summary: Press and hold a point for a duration.
    wire: long_press
    mcp: long_press
    kotlin: long_press
    cli: [long_press, longpress]
    params:
      - { name: x, type: number, required: true }
      - { name: y, type: number, required: true }
      - { name: durationMs, type: number, required: false }

  - id: drag
    summary: Drag from one point to another, slowly enough to register.
    wire: drag
    mcp: drag
    kotlin: drag
    cli: [drag]
    params:
      - { name: x1, type: number, required: true }
      - { name: y1, type: number, required: true }
      - { name: x2, type: number, required: true }
      - { name: y2, type: number, required: true }
      - { name: durationMs, type: number, required: false }

  - id: pinch
    summary: Two-finger pinch to zoom, from one span to another.
    wire: pinch
    mcp: pinch
    kotlin: pinch
    cli: [pinch]
    params:
      - { name: fromDistance, type: number, required: true }
      - { name: toDistance, type: number, required: true }

  # --- text entry ---
  - id: type
    summary: Type into the focused field; replace by default, append on request. Password fields are refused.
    wire: type
    mcp: type
    kotlin: type
    cli: [type]
    params:
      - { name: text, type: string, required: true }
      - { name: mode, type: "insert|replace|append", required: false }

  - id: press
    summary: Press a navigation or submit key.
    wire: press
    mcp: key
    kotlin: key
    cli: [press]
    params:
      - { name: key, type: "back|home|recents|enter|search|go|send|next|done", required: true }

  # --- launching ---
  - id: open_app
    summary: Open an installed app by package name or by name; the phone resolves names locally.
    wire: open_app
    mcp: open_app
    kotlin: open_app
    cli: [open_app, open]
    params:
      - { name: packageName, type: string, required: false }
      - { name: name, type: string, required: false, note: "human name or alias; resolved on the phone" }

  - id: open_settings
    summary: Jump straight to a settings screen instead of tapping through menus.
    wire: open_settings
    mcp: open_settings
    kotlin: open_settings
    cli: [open_settings, settings]
    params:
      - { name: name, type: string, required: true }
      - { name: packageName, type: string, required: false }

  # --- conversation / control ---
  - id: speak
    summary: Say something on the phone.
    wire: speak
    mcp: speak
    kotlin: speak
    cli: [speak]
    params:
      - { name: text, type: string, required: true }

  - id: ask_user
    summary: Ask the owner a question and wait for the answer.
    wire: ask_user
    mcp: ask_user
    kotlin: ask
    cli: [ask_user, ask]

  - id: confirm
    summary: Request the owner's confirmation for a risky action.
    wire: confirm
    mcp: confirm

  - id: done
    summary: Finish the task and report whether it succeeded.
    wire: done
    mcp: done
    kotlin: done
    params:
      - { name: ok, type: boolean, required: false }
      - { name: ref, type: string, required: false }

  - id: wait_for_request
    summary: Long-poll for the next request from the owner.
    wire: wait_for_request
    mcp: wait_for_request
    params:
      - { name: timeoutMs, type: number, required: false }

  - id: ping
    summary: Liveness check.
    wire: ping
    cli: [ping]

  - id: info
    summary: Report app name, version and features.
    wire: info

  - id: disconnect
    summary: End the session.
    wire: disconnect
    mcp: disconnect

  - id: cancel
    summary: Cancel the current operation.
    wire: cancel

  # --- on-phone brain only (local tools, never on the wire) ---
  - id: remember
    summary: Store a fact in the phone-side memory.
    kotlin: remember

  - id: forget
    summary: Delete a stored fact.
    kotlin: forget

  - id: recall_text
    summary: Read back previously copied text.
    kotlin: recall_text

  - id: copy_text
    summary: Copy text to the phone clipboard.
    kotlin: copy_text

  - id: schedule_task
    summary: Schedule a task to run later on the phone.
    kotlin: schedule_task

  # --- harness control (MCP host only) ---
  - id: pair
    summary: Pair the MCP host with a phone using a one-time code.
    mcp: pair

  - id: status
    summary: Report connection, display and brain status.
    mcp: status
