# Seed catalogue for on-device app resolution.
#
# Grounded in this repo, not guessed:
#   package ids  -> android/app/src/main/java/app/nase/companion/ui/Models.kt (SUGGESTIONS)
#   hiddenDisplay-> docs/hidden-display-apps.md, "Matrix by category"
#
# This file is only a SEED. Existence is decided on the device by PackageManager,
# and hiddenDisplay is a default expectation that Nase re-verifies at runtime
# (see "Nase never guesses" in docs/hidden-display-apps.md). An app that is not
# listed here still opens when installed; listing it only adds aliases.
#
# Compiles to android/app/src/main/assets/apps_seed.json via `npm run describe`.

schema: 1

apps:
  # --- rides & travel: payment on file, maps may render empty off-screen ---
  - package: com.ubercab
    label: Uber
    aliases: [uber, rides, taxi]
    hiddenDisplay: bounces
    safetyTags: [payment]
  - package: me.lyft.android
    label: Lyft
    aliases: [lyft, rides]
    hiddenDisplay: bounces
    safetyTags: [payment]
