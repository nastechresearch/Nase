name: release

# Produces a real, signed release APK. The keystore lives only in repository
# secrets (ANDROID_KEYSTORE_BASE64 plus its password/alias); nothing is committed
# and the decoded file is deleted from the runner afterwards.
# This workflow signs and uploads artifacts. It does not publish a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK 36
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run describe -- --check
      - run: npm run describe:manifest
      - run: npm test

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to build an unsigned release." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nase-release.jks"
          test -s "$RUNNER_TEMP/nase-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          NASE_KEYSTORE_PATH: ${{ runner.temp }}/nase-release.jks
          NASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the APK is signed with the Nase release key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "No app-release.apk: the release build produced an unsigned artifact." >&2
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -qi "Android Debug" /tmp/certs.txt; then
            echo "Release APK is debug-signed. Refusing to ship it." >&2
            exit 1
          fi
          grep -q "CN=Nase" /tmp/certs.txt

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/nase-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: nase-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
